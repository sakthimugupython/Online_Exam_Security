{% extends 'base.html' %}

{% block sidebar %}
<nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
    <div class="position-sticky pt-3">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'teacher_dashboard' %}active{% endif %}" href="{% url 'teacher_dashboard' %}">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if 'question' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'teacher_questions' %}">
                    <i class="bi bi-question-circle"></i> Questions
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if 'exam' in request.resolver_match.url_name and 'question' not in request.resolver_match.url_name %}active{% endif %}" href="{% url 'teacher_exams' %}">
                    <i class="bi bi-file-earmark-text"></i> Exams
                </a>
            </li>
        </ul>
    </div>
</nav>
{% endblock %}
