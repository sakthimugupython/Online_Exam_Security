{% extends 'myapp/teacher/base.html' %}

{% block title %}{% if exam %}Edit{% else %}Create{% endif %} Exam{% endblock %}

{% block content %}
<h2 class="mb-4">{% if exam %}Edit{% else %}Create{% endif %} Exam</h2>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text" name="title" class="form-control" value="{{ exam.title|default:'' }}" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3">{{ exam.description|default:'' }}</textarea>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Duration (minutes)</label>
                <input type="number" name="duration_minutes" class="form-control" value="{{ exam.duration_minutes|default:60 }}" min="1" required>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <div class="form-check">
                        <input type="checkbox" name="randomize_questions" class="form-check-input" id="randomizeQ" {% if exam.randomize_questions or not exam %}checked{% endif %}>
                        <label class="form-check-label" for="randomizeQ">Randomize question order</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-check">
                        <input type="checkbox" name="randomize_options" class="form-check-input" id="randomizeO" {% if exam.randomize_options or not exam %}checked{% endif %}>
                        <label class="form-check-label" for="randomizeO">Randomize MCQ options</label>
                    </div>
                </div>
            </div>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">{% if exam %}Update{% else %}Create{% endif %} Exam</button>
                <a href="{% url 'teacher_exams' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
