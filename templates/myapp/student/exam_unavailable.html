{% extends 'myapp/student/base.html' %}

{% block title %}Exam Unavailable{% endblock %}

{% block content %}
<div class="text-center py-5">
    <i class="bi bi-exclamation-circle text-warning" style="font-size: 4rem;"></i>
    <h2 class="mt-3">Exam Not Available</h2>
    <p class="text-muted">
        {{ exam.title }} is not available at this time.
    </p>
    <p class="text-muted">
        <i class="bi bi-clock"></i> Current Time: <strong id="currentTimeDisplay">--:--:--</strong>
    </p>
    <a href="{% url 'student_dashboard' %}" class="btn btn-primary">Back to Dashboard</a>
</div>
<script>
    function updateTime() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        hours = String(hours).padStart(2, '0');
        document.getElementById('currentTimeDisplay').textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
    }
    updateTime();
    setInterval(updateTime, 1000);
</script>
{% endblock %}
