<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Online Exam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --color-1: #03071e;
            --color-2: #370617;
            --color-3: #6a040f;
            --color-7: #e85d04;
            --color-8: #f48c06;
            --color-10: #ffba08;
        }
        body {
            background: linear-gradient(135deg, var(--color-1), var(--color-2), var(--color-3));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 400px;
            width: 100%;
        }
        .login-header {
            background: linear-gradient(135deg, var(--color-7), var(--color-8));
            color: var(--color-1);
            padding: 30px;
            text-align: center;
        }
        .login-header h2 { margin: 0; font-weight: bold; }
        .login-body { padding: 30px; }
        .btn-login {
            background: linear-gradient(135deg, var(--color-7), var(--color-8));
            border: none;
            color: var(--color-1);
            font-weight: bold;
            padding: 12px;
        }
        .btn-login:hover {
            background: var(--color-10);
            color: var(--color-1);
        }
        .form-control:focus {
            border-color: var(--color-8);
            box-shadow: 0 0 0 0.2rem rgba(244,140,6,0.25);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h2>🎓 Online Exam</h2>
            <p class="mb-0">Sign in to continue</p>
            <p class="mb-0 mt-2" id="loginTime" style="font-size: 0.9rem; opacity: 0.9;">
                <i class="bi bi-clock"></i> <span id="loginTimeDisplay">--:--:--</span>
            </p>
        </div>
        <div class="login-body">
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-login w-100">Sign In</button>
            </form>
        </div>
    </div>
    <script>
        function updateLoginTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            hours = String(hours).padStart(2, '0');
            document.getElementById('loginTimeDisplay').textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
        }
        updateLoginTime();
        setInterval(updateLoginTime, 1000);
    </script>
</body>
</html>
