services:
  - type: web
    name: onlinexam
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn onlinexam.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: onlinexam_db
          property: connectionString

databases:
  - name: onlinexam_db
    databaseName: onlinexam
    user: onlinexam
    plan: free
